name: Python Test Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies and Coverage Tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run Tests with Coverage
        run: |
          pytest --cov=src --cov-fail-under=80 --junitxml=pytest.xml --cov-report=term-missing | tee pytest-coverage.txt

      - name: Publish Coverage Comment
        uses: MishaKav/pytest-coverage-comment@v3
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml